[pytest]
# Repo root first: `ptc`, `ledger` and `step2` are imported as top-level packages
# (`from ptc.runtime import ...`), not from `src/`. Without `.` every test file has
# to re-insert the root itself, which is why they all carry a `sys.path.insert`
# plus a `# noqa: E402`.
pythonpath = . src tests

# Explicit -m on the command line overrides this default marker expression:
# python -m pytest bench/test_contamination.py -m tokenizer_integration \
#   --tokenizer-artifact /absolute/local/snapshot
addopts = -m "not tokenizer_integration"
markers =
    tokenizer_integration: requires an explicit, digest-admitted local tokenizer artifact

# All three suites. This used to read `testpaths = tests`, so a bare `pytest`
# collected 51 and silently skipped `ptc` and `ledger` -- the two that adjudicate
# the result. HANDOFF.md documented the workaround (`pytest tests ptc ledger`)
# instead of fixing it; fixed 2026-10-10.
#
# `step2/` is deliberately NOT here: some of its tests need `transformers` and
# reach the HF hub, and the default suite must stay offline. Run it on its own:
#   .venv-ptc/bin/python -m pytest step2
testpaths = tests ptc ledger bench train
